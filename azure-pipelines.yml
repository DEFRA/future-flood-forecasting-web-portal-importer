name: 1.0.0.$(Build.BuildID)

resources:
  - repo: self

pool:
  vmImage: ubuntu-24.04

pr: none
trigger:
  - master

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '24.x' # replace this value with the version that you need for your project
  - script: |
      echo "##vso[task.setvariable variable=JAVA_HOME]$(JAVA_HOME_17_X64)"
      echo "##vso[task.setvariable variable=PATH]$(JAVA_HOME_17_X64)/bin:$(PATH)"
  - script: npm ci --ignore-scripts
  - script: npm run build
  - script: npx markdownlint $PWD --ignore node_modules
  - script: npm test
  - script: find ./node_modules -print -exec touch {} \;
  - script: find . -ls

  - script: |
      sudo apt update
      sudo apt install -y mono-complete
    displayName: 'Install mono'

  - task: NuGetCommand@2
    displayName: 'NuGet pack'
    inputs:
      command: pack
      packagesToPack: '$(Build.SourcesDirectory)/managedserver.nuspec'
      versioningScheme: byBuildNumber

  - task: NuGetCommand@2
    displayName: 'NuGet push'
    inputs:
      command: push
      packagesToPush: '$(Build.ArtifactStagingDirectory)/*.nupkg'
      publishVstsFeed: '$(NugetFeed)'
